  <style>
    :root {
      --black: #000;
      --ink: #0a0a0a;
      --text: #f3efe7;
      --text-soft: rgba(243, 239, 231, 0.72);
      --text-faint: rgba(243, 239, 231, 0.42);
      --gold: #c9a96e;
      --gold-soft: rgba(201, 169, 110, 0.32);
      --gold-faint: rgba(201, 169, 110, 0.14);
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      /* Static black-gold gradient: shown when WebGL is off, fails, or reduced motion is on */
      background-color: var(--black);
      background-image:
        radial-gradient(120% 70% at 50% 108%, rgba(201, 169, 110, 0.16) 0%, rgba(201, 169, 110, 0.04) 40%, transparent 70%),
        radial-gradient(80% 50% at 50% 0%, rgba(201, 169, 110, 0.07) 0%, transparent 70%),
        linear-gradient(180deg, #000 0%, #070605 60%, #0b0907 100%);
      background-attachment: fixed;
    }

    ::selection { background: rgba(201, 169, 110, 0.3); color: var(--text); }

    /* ---------- Background layers (never block taps) ---------- */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.6s var(--ease);
    }
    #scene.ready { opacity: 1; }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 70% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.7) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, transparent 22%, transparent 70%, rgba(0, 0, 0, 0.8) 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
      animation: grain 6s steps(6) infinite;
    }
    @keyframes grain {
      0%, 100% { background-position: 0 0; }
      17% { background-position: -31px 19px; }
      33% { background-position: 23px -37px; }
      50% { background-position: -17px -23px; }
      67% { background-position: 41px 11px; }
      83% { background-position: -9px 33px; }
    }

    /* ---------- Layout ---------- */
    .page {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding:
        max(28px, env(safe-area-inset-top, 0px))
        max(20px, env(safe-area-inset-right, 0px))
        max(22px, env(safe-area-inset-bottom, 0px))
        max(20px, env(safe-area-inset-left, 0px));
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: auto 0;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ---------- Brand ---------- */
    .brand {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      max-width: 100%;
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(1.75rem, 8.6vw, 5.25rem);
      line-height: 1;
      letter-spacing: 0.16em;
      padding-left: 0.16em; /* optically re-centre the trailing letter-spacing */
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    @media (min-width: 640px) {
      .brand { letter-spacing: 0.26em; padding-left: 0.26em; }
      main { max-width: 760px; }
    }

    .brand span {
      display: inline-block;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(0.18em);
      animation: reveal 1.6s var(--ease) forwards;
      animation-delay: calc(0.5s + var(--i) * 0.075s);
    }
    .brand .gap { width: 0.38em; }

    @keyframes reveal {
      55% { opacity: 1; }
      100% { opacity: 1; filter: blur(0); transform: none; }
    }

    .tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      margin-top: 18px;
      opacity: 0;
      animation: rise 1.4s var(--ease) 1.25s forwards;
    }
    .tagline p {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      white-space: nowrap;
      color: var(--gold);
    }
    .tagline i {
      display: block;
      flex: 0 0 auto;
      width: clamp(16px, 7vw, 56px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
      transform: scaleX(0);
      transform-origin: right;
      animation: draw 1.6s var(--ease) 1.45s forwards;
    }
    .tagline i:last-child {
      background: linear-gradient(90deg, var(--gold), transparent);
      transform-origin: left;
    }
    @keyframes draw { to { transform: scaleX(1); } }
    @media (max-width: 340px) { .tagline i { display: none; } }

    /* ---------- Contact card ---------- */
    .card-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin-top: clamp(36px, 7svh, 64px);
      opacity: 0;
      animation: rise 1.6s var(--ease) 1.7s forwards;
    }
    /* dark halo so the card stays readable over the towers */
    .card-wrap::before {
      content: "";
      position: absolute;
      inset: -60px -10px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.5) 60%, transparent);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px 22px 24px;
      border-radius: 18px;
      border: 1px solid rgba(201, 169, 110, 0.22);
      background:
        linear-gradient(150deg, rgba(255, 250, 240, 0.07) 0%, rgba(255, 250, 240, 0.015) 45%, rgba(0, 0, 0, 0.35) 100%),
        rgba(12, 11, 10, 0.55);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      backdrop-filter: blur(22px) saturate(140%);
      box-shadow:
        0 30px 70px -20px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 rgba(255, 244, 222, 0.14);
    }
    @media (min-width: 640px) { .card { padding: 40px 36px 32px; } }

    .card::after { /* moving light sheen */
      content: "";
      position: absolute;
      top: -50%;
      bottom: -50%;
      left: -60%;
      width: 50%;
      pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255, 240, 210, 0.07) 45%, rgba(255, 240, 210, 0.12) 50%, rgba(255, 240, 210, 0.07) 55%, transparent);
      transform: translateX(0) rotate(12deg);
      animation: sheen 9s ease-in-out 3.2s infinite;
    }
    @keyframes sheen {
      0% { transform: translateX(0) rotate(12deg); }
      45%, 100% { transform: translateX(440%) rotate(12deg); }
    }

    .card-text {
      position: relative;
      z-index: 1;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(1.3rem, 5.4vw, 1.6rem);
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 26px;
    }

    .buttons {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--gold-soft);
      background: rgba(0, 0, 0, 0.45);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      overflow: hidden;
      touch-action: manipulation;
      transition: color 0.45s var(--ease), border-color 0.45s var(--ease), box-shadow 0.45s var(--ease), transform 0.2s ease;
    }
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, rgba(201, 169, 110, 0.08), rgba(201, 169, 110, 0.2) 50%, rgba(201, 169, 110, 0.08));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.6s var(--ease);
    }
    .btn > * { position: relative; }
    .btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    .btn:hover, .btn:focus-visible, .btn:active {
      color: #f1dcb1;
      border-color: rgba(201, 169, 110, 0.75);
      box-shadow: 0 0 24px -4px rgba(201, 169, 110, 0.35), inset 0 0 12px rgba(201, 169, 110, 0.08);
      outline: none;
    }
    .btn:hover::before, .btn:focus-visible::before, .btn:active::before { transform: scaleX(1); }
    .btn:active { transform: scale(0.985); }

    footer {
      font-size: 0.66rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-faint);
      text-align: center;
      opacity: 0;
      animation: rise 1.4s var(--ease) 2.1s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- Reduced motion: static, everything visible ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .brand span, .tagline, .card-wrap, footer {
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }
      .tagline i { transform: none !important; }
      .card::after { display: none; }
      #scene { display: none; }
    }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function () {
    'use strict';

    var mq = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
    if (mq('(prefers-reduced-motion: reduce)')) return;          // static gradient only
    if (typeof window.THREE === 'undefined') return;             // CDN failed → static gradient

    var canvas = document.getElementById('scene');
    var finePointer = mq('(hover: hover) and (pointer: fine)');
    var mobile = !finePointer || window.innerWidth < 768;
    var portrait = window.innerWidth / window.innerHeight < 0.85;

    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !mobile, powerPreference: 'high-performance' });
    } catch (e) { return; }                                      // no WebGL → static gradient
    if (!renderer.getContext()) return;

    var DPR = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);
    renderer.setPixelRatio(DPR);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 1);
    renderer.outputEncoding = THREE.sRGBEncoding;

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, portrait ? 0.03 : 0.036);

    var camera = new THREE.PerspectiveCamera(portrait ? 56 : 44, window.innerWidth / window.innerHeight, 0.5, 140);

    /* Camera path: starts close, pulls back. On portrait phones the camera sits
       lower and further back, looking up, so the towers frame the text. */
    var CAM = portrait
      ? { z0: 15, z1: 31, y0: 2.2, y1: 2.8, look: 8.5, sway: 0.8 }
      : { z0: 12, z1: 24, y0: 4.0, y1: 5.2, look: 5.0, sway: 1.4 };
    camera.position.set(0, CAM.y0, CAM.z0);
    camera.lookAt(0, CAM.look, -6);

    /* Light */
    scene.add(new THREE.AmbientLight(0x1a1712, 1.1));
    var rim = new THREE.DirectionalLight(0xc9a96e, 1.6);
    rim.position.set(10, 22, -24);
    scene.add(rim);
    var warm = new THREE.PointLight(0xd8b77c, 1.6, 60, 1.8);
    warm.position.set(0, 12, -6);
    scene.add(warm);
    var cool = new THREE.DirectionalLight(0x1e2533, 0.7);
    cool.position.set(-16, 8, 18);
    scene.add(cool);

    /* Floor: dark, glossy */
    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x030303, roughness: 0.32, metalness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    /* Seeded random so the skyline is the same on every visit */
    var seed = 20241;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

    /* Window textures: black glass with a few warm lit windows */
    function windowTexture() {
      var c = document.createElement('canvas');
      c.width = 64; c.height = 256;
      var g = c.getContext('2d');
      g.fillStyle = '#000';
      g.fillRect(0, 0, 64, 256);
      g.fillStyle = 'rgba(201,169,110,0.05)';
      for (var x = 0; x < 64; x += 8) g.fillRect(x, 0, 1, 256);
      for (var y = 6; y < 250; y += 7) {
        for (var cx = 2; cx < 60; cx += 8) {
          var r = rnd();
          if (r > 0.93) {
            var a = 0.45 + rnd() * 0.5;
            g.fillStyle = r > 0.975 ? 'rgba(255,228,180,' + a + ')' : 'rgba(201,169,110,' + (a * 0.7) + ')';
            g.fillRect(cx, y, 5, 3);
          }
        }
      }
      var t = new THREE.CanvasTexture(c);
      t.encoding = THREE.sRGBEncoding;
      return t;
    }
    var glass = [windowTexture(), windowTexture(), windowTexture()].map(function (tex) {
      return new THREE.MeshStandardMaterial({
        color: 0x050505, roughness: 0.12, metalness: 0.95,
        emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.9
      });
    });
    var roof = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.3, metalness: 0.8 });
    var edgeBright = new THREE.LineBasicMaterial({ color: 0xc9a96e, transparent: true, opacity: 0.5 });
    var edgeSoft = new THREE.LineBasicMaterial({ color: 0xc9a96e, transparent: true, opacity: 0.2 });
    var edgeMirror = new THREE.LineBasicMaterial({ color: 0xc9a96e, transparent: true, opacity: 0.06 });

    var city = new THREE.Group();
    scene.add(city);

    function block(w, h, d, x, y, z, mat, bright) {
      var geo = new THREE.BoxGeometry(w, h, d);
      var mesh = new THREE.Mesh(geo, [mat, mat, roof, roof, mat, mat]);
      mesh.position.set(x, y, z);
      city.add(mesh);
      var edges = new THREE.EdgesGeometry(geo);
      var line = new THREE.LineSegments(edges, bright ? edgeBright : edgeSoft);
      line.position.set(x, y, z);
      city.add(line);
      var mirror = new THREE.LineSegments(edges, edgeMirror);   // faint reflection in the floor
      mirror.position.set(x, -y, z);
      city.add(mirror);
    }

    var towers = mobile ? 16 : 38;
    var width = portrait ? 16 : 30;
    for (var i = 0; i < towers; i++) {
      var s = towers === 1 ? 0 : (i / (towers - 1)) * 2 - 1;     // -1 … 1 across the horizon
      var x = s * width + (rnd() - 0.5) * 2;
      var z = -3 - Math.pow(Math.abs(s), 0.8) * 9 - rnd() * 13;
      var centre = Math.max(0.25, 1 - Math.abs(x) / (width * 0.9));
      var w = 1 + rnd() * 1.4, d = 1 + rnd() * 1.4;
      var h = (4 + rnd() * 11) * (0.55 + centre * 0.7);
      if (i % 6 === 0 && Math.abs(x) < width * 0.4) h *= 1.3;
      var mat = glass[i % glass.length];
      block(w, h, d, x, h / 2, z, mat, i % 3 === 0);
      if (h > 9 && rnd() > 0.4) {                                 // stepped crown
        var ch = 1.2 + rnd() * 2;
        block(w * 0.66, ch, d * 0.66, x, h + ch / 2, z, mat, true);
        if (rnd() > 0.5) {                                        // thin gold spire
          var sp = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x, h + ch, z), new THREE.Vector3(x, h + ch + 1.5 + rnd() * 1.5, z)
          ]);
          city.add(new THREE.Line(sp, edgeBright));
        }
      }
    }

    /* Gold dust */
    var N = mobile ? 60 : 220;
    var pos = new Float32Array(N * 3), speed = new Float32Array(N), phase = new Float32Array(N);
    for (var p = 0; p < N; p++) {
      pos[p * 3] = (rnd() - 0.5) * 40;
      pos[p * 3 + 1] = rnd() * 18;
      pos[p * 3 + 2] = (rnd() - 0.5) * 30;
      speed[p] = 0.25 + rnd() * 0.5;
      phase[p] = rnd() * Math.PI * 2;
    }
    var dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var sc = document.createElement('canvas');
    sc.width = sc.height = 32;
    var sg = sc.getContext('2d');
    var grad = sg.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,238,205,1)');
    grad.addColorStop(0.35, 'rgba(201,169,110,0.6)');
    grad.addColorStop(1, 'rgba(201,169,110,0)');
    sg.fillStyle = grad;
    sg.fillRect(0, 0, 32, 32);
    var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      map: new THREE.CanvasTexture(sc), size: mobile ? 0.22 : 0.18,
      transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(dust);

    /* Desktop-only mouse parallax */
    var mx = 0, my = 0, px = 0, py = 0;
    if (finePointer) {
      window.addEventListener('mousemove', function (e) {
        mx = (e.clientX / window.innerWidth) * 2 - 1;
        my = (e.clientY / window.innerHeight) * 2 - 1;
      }, { passive: true });
    }

    /* Resize — ignore small height changes from the mobile browser bar */
    var lastW = window.innerWidth, lastH = window.innerHeight;
    window.addEventListener('resize', function () {
      var w = window.innerWidth, h = window.innerHeight;
      if (w === lastW && Math.abs(h - lastH) < 140) return;
      lastW = w; lastH = h;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }, { passive: true });

    /* Loop */
    var INTRO = 4000;
    var start = null, prev = 0;
    function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

    function frame(now) {
      requestAnimationFrame(frame);
      if (start === null) { start = now; prev = now; }
      var dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      var el = now - start, t = el / 1000;

      var k = easeOut(Math.min(1, el / INTRO));
      var drift = easeOut(Math.min(1, el / (INTRO * 1.4)));    // drift fades in after the pull-back

      px += (mx - px) * 0.04;
      py += (my - py) * 0.04;

      camera.position.x = Math.sin(t * 0.15) * CAM.sway * drift + px * 1.6;
      camera.position.y = CAM.y0 + (CAM.y1 - CAM.y0) * k + Math.cos(t * 0.11) * 0.25 * drift - py * 0.6;
      camera.position.z = CAM.z0 + (CAM.z1 - CAM.z0) * k + Math.sin(t * 0.09) * 0.6 * drift;
      camera.lookAt(px * 0.6, CAM.look - py * 0.3, -6);

      var a = dustGeo.attributes.position.array;
      for (var j = 0; j < N; j++) {
        a[j * 3 + 1] += speed[j] * dt;
        a[j * 3] += Math.sin(t * 0.5 + phase[j]) * 0.12 * dt;
        if (a[j * 3 + 1] > 18) a[j * 3 + 1] = 0;
      }
      dustGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
      if (el === 0) canvas.classList.add('ready');            // fade in once the first frame is drawn
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
