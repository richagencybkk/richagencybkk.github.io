  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --text: #f3f0ea;
      --text-muted: #9a958c;
      --gold: #c9a96e;
      --border: rgba(243, 240, 234, 0.16);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3.5rem 1.75rem 2.25rem;
      animation: fadeIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        animation: none;
      }
    }

    .spacer {
      flex: 0.2;
    }

    main {
      width: 100%;
      max-width: 380px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.25rem, 8vw, 2.85rem);
      letter-spacing: 0.24em;
      padding-left: 0.24em; /* Visually center wide letter-spacing */
      line-height: 1.1;
      color: var(--text);
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 0.9rem;
      font-size: 0.6875rem;
      font-weight: 400;
      letter-spacing: 0.26em;
      padding-left: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .divider {
      width: 48px;
      height: 1px;
      background-color: var(--gold);
      opacity: 0.55;
      margin: 2.75rem 0;
    }

    .intro {
      font-size: 0.9375rem;
      line-height: 1.75;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      max-width: 28ch;
      margin-bottom: 2.75rem;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 1.125rem 1.5rem;
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: border-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
      transition: color 0.3s ease;
    }

    .btn:hover,
    .btn:focus-visible,
    .btn:active {
      border-color: var(--gold);
      color: var(--gold);
      background-color: #0d0c0a;
      outline: none;
    }

    footer {
      width: 100%;
      max-width: 380px;
      padding-top: 2rem;
      border-top: 1px solid rgba(243, 240, 234, 0.07);
      text-align: center;
      font-size: 0.6875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
