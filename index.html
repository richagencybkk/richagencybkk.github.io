<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RICH AGENCY — Luxury Condo Rentals · Bangkok</title>
  <meta name="description" content="Rich Agency curates Bangkok's finest luxury condominium rentals. Private viewings and bespoke residence advisory in Sukhumvit, Sathorn, Wireless Road, and the Chao Phraya riverfront.">
  <meta name="theme-color" content="#070709">

  <!-- Open Graph -->
  <meta property="og:title" content="RICH AGENCY — Luxury Condo Rentals · Bangkok">
  <meta property="og:description" content="Find your next home in Bangkok. Exclusive luxury condominium rentals curated by Rich Agency.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rich Agency Bangkok">
  <meta property="og:url" content="https://richagencybkk.github.io/">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #060608;
      --bg-obsidian: #0b0b10;
      --gold: #c9a96e;
      --gold-bright: #e5cb96;
      --gold-dim: rgba(201, 169, 110, 0.28);
      --gold-border: rgba(201, 169, 110, 0.34);
      --gold-glow: rgba(201, 169, 110, 0.22);
      --text-primary: #f6f2eb;
      --text-secondary: rgba(246, 242, 235, 0.72);
      --text-muted: rgba(246, 242, 235, 0.42);
      --card-bg: rgba(12, 12, 16, 0.56);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      selection-background-color: var(--gold);
    }

    ::selection {
      background: rgba(201, 169, 110, 0.3);
      color: var(--text-primary);
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      /* Dark gold architectural fallback gradient if WebGL is unavailable */
      background:
        radial-gradient(110% 80% at 50% 18%, rgba(201, 169, 110, 0.14) 0%, rgba(20, 17, 13, 0.45) 42%, rgba(6, 6, 8, 0.98) 100%),
        radial-gradient(65% 55% at 50% 85%, rgba(201, 169, 110, 0.08) 0%, transparent 75%),
        linear-gradient(180deg, #09080c 0%, #050507 65%, #08070a 100%);
    }

    body.webgl-fallback::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        repeating-linear-gradient(90deg, rgba(201, 169, 110, 0.03) 0px, rgba(201, 169, 110, 0.03) 1px, transparent 1px, transparent 72px),
        radial-gradient(circle at 50% 32%, rgba(201, 169, 110, 0.20), transparent 62%);
    }

    /* Fullscreen 3D Canvas — strictly non-blocking */
    #skyline-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.2s var(--ease-out-expo);
    }

    #skyline-canvas.is-ready {
      opacity: 1;
    }

    /* Subtle atmospheric vignette & film grain — strictly non-blocking */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, transparent 32%, rgba(5, 5, 7, 0.66) 100%),
        linear-gradient(180deg, rgba(5, 5, 7, 0.55) 0%, transparent 24%, transparent 72%, rgba(5, 5, 7, 0.85) 100%);
    }

    .grain-overlay {
      position: fixed;
      inset: -40%;
      width: 180%;
      height: 180%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.038;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grainShift 7s steps(8) infinite;
    }

    @keyframes grainShift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3%, 2%); }
      40% { transform: translate(2%, -3%); }
      60% { transform: translate(-2%, -2%); }
      80% { transform: translate(3%, 1%); }
    }

    /* Custom smooth cursor (Desktop only) */
    .custom-cursor-dot,
    .custom-cursor-ring {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate3d(-100px, -100px, 0);
    }

    @media (hover: hover) and (pointer: fine) {
      .custom-cursor-dot {
        display: block;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        margin-top: -2.5px;
        border-radius: 50%;
        background: var(--gold-bright);
        box-shadow: 0 0 10px var(--gold);
        transition: transform 0.15s ease, opacity 0.25s ease;
      }

      .custom-cursor-ring {
        display: block;
        width: 34px;
        height: 34px;
        margin-left: -17px;
        margin-top: -17px;
        border-radius: 50%;
        border: 1px solid rgba(201, 169, 110, 0.45);
        background: rgba(201, 169, 110, 0.03);
        transition: width 0.35s var(--ease-out-expo),
                    height 0.35s var(--ease-out-expo),
                    margin 0.35s var(--ease-out-expo),
                    border-color 0.35s ease,
                    background-color 0.35s ease;
      }

      .custom-cursor-ring.is-hovering {
        width: 56px;
        height: 56px;
        margin-left: -28px;
        margin-top: -28px;
        border-color: rgba(229, 203, 150, 0.85);
        background: rgba(201, 169, 110, 0.10);
      }
    }

    /* Foreground UI Layout */
    .page-shell {
      position: relative;
      z-index: 5;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding:
        max(1.75rem, env(safe-area-inset-top, 1.75rem))
        max(1.25rem, env(safe-area-inset-right, 1.25rem))
        max(1.4rem, env(safe-area-inset-bottom, 1.4rem))
        max(1.25rem, env(safe-area-inset-left, 1.25rem));
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 0.25rem;
      opacity: 0;
      animation: fadeSlideIn 1.4s var(--ease-out-expo) 0.2s forwards;
    }

    .top-monogram {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.68rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .top-monogram::before,
    .top-monogram::after {
      content: "";
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    /* Center Hero Content */
    .hero-main {
      width: 100%;
      max-width: 780px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 0;
    }

    /* Brand Title: Blur-to-sharp letter reveal */
    .brand-title {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(2.45rem, 8.2vw, 5.75rem);
      line-height: 1.04;
      letter-spacing: 0.28em;
      padding-left: 0.28em; /* Optical balance for wide letter-spacing */
      text-transform: uppercase;
      color: var(--text-primary);
      text-shadow: 0 12px 42px rgba(0, 0, 0, 0.75);
      margin-bottom: 1.15rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .brand-title .char {
      display: inline-block;
      opacity: 0;
      filter: blur(14px);
      transform: translateY(14px) scale(1.04);
      animation: charReveal 1.35s var(--ease-out-expo) forwards;
      animation-delay: calc(0.18s + var(--char-index, 0) * 0.075s);
      will-change: transform, opacity, filter;
    }

    .brand-title .char-space {
      width: 0.42em;
    }

    @keyframes charReveal {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(14px) scale(1.04);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0) scale(1);
      }
    }

    /* Small caps subtitle with animated gold line drawing beside it */
    .subtitle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.65rem, 2.2vw, 1.25rem);
      margin-bottom: clamp(2.2rem, 5vh, 3.4rem);
      width: 100%;
    }

    .gold-draw-line {
      position: relative;
      display: block;
      width: clamp(28px, 8vw, 76px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-bright));
      transform: scaleX(0);
      transform-origin: right center;
      animation: drawGoldLine 1.5s var(--ease-out-expo) 0.95s forwards;
    }

    .gold-draw-line.right {
      background: linear-gradient(90deg, var(--gold-bright), var(--gold), transparent);
      transform-origin: left center;
    }

    .gold-draw-line::after {
      content: "";
      position: absolute;
      top: -1.5px;
      right: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 8px var(--gold);
    }

    .gold-draw-line.right::after {
      right: auto;
      left: 0;
    }

    @keyframes drawGoldLine {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }
      100% {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    .brand-subtitle {
      font-family: var(--font-sans);
      font-size: clamp(0.68rem, 1.8vw, 0.82rem);
      font-weight: 400;
      letter-spacing: 0.34em;
      padding-left: 0.34em;
      font-variant: small-caps;
      text-transform: uppercase;
      color: var(--gold-bright);
      opacity: 0;
      animation: fadeSlideIn 1.3s var(--ease-out-expo) 0.85s forwards;
      white-space: nowrap;
    }

    @media (max-width: 400px) {
      .brand-subtitle {
        letter-spacing: 0.22em;
        padding-left: 0.22em;
        font-size: 0.64rem;
      }
    }

    /* Glassmorphism Contact Card with 3D Tilt & Moving Light Sheen */
    .card-perspective {
      perspective: 1100px;
      width: 100%;
      max-width: 470px;
      opacity: 0;
      animation: cardEntrance 1.5s var(--ease-out-expo) 1.15s forwards;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .contact-card {
      position: relative;
      width: 100%;
      padding: clamp(1.85rem, 5vw, 2.65rem) clamp(1.4rem, 4.5vw, 2.4rem);
      border-radius: 20px;
      background:
        linear-gradient(145deg, rgba(24, 22, 28, 0.68) 0%, rgba(10, 10, 14, 0.52) 100%);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--gold-border);
      box-shadow:
        0 28px 68px -16px rgba(0, 0, 0, 0.82),
        0 0 38px -10px rgba(201, 169, 110, 0.14),
        inset 0 1px 0 0 rgba(255, 243, 219, 0.16);
      transform-style: preserve-3d;
      transition: transform 0.22s ease-out, border-color 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
    }

    .contact-card:hover {
      border-color: rgba(201, 169, 110, 0.56);
      box-shadow:
        0 32px 75px -14px rgba(0, 0, 0, 0.88),
        0 0 46px -8px rgba(201, 169, 110, 0.22),
        inset 0 1px 0 0 rgba(255, 243, 219, 0.25);
    }

    /* Ambient moving light sheen across the glass card */
    .card-sheen {
      position: absolute;
      inset: -60%;
      pointer-events: none;
      background: linear-gradient(
        115deg,
        transparent 38%,
        rgba(201, 169, 110, 0.08) 47%,
        rgba(255, 245, 224, 0.16) 50%,
        rgba(201, 169, 110, 0.08) 53%,
        transparent 62%
      );
      transform: translateX(-70%) rotate(8deg);
      animation: sheenSweep 8.5s ease-in-out infinite;
    }

    @keyframes sheenSweep {
      0%, 22% {
        transform: translateX(-75%) rotate(8deg);
      }
      58%, 100% {
        transform: translateX(75%) rotate(8deg);
      }
    }

    /* Cursor spotlight inside card */
    .card-glow-spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        340px circle at var(--spot-x, 50%) var(--spot-y, 20%),
        rgba(201, 169, 110, 0.13),
        transparent 70%
      );
      opacity: 0.85;
    }

    .card-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.65rem;
    }

    .card-headline {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(1.38rem, 3.6vw, 1.75rem);
      line-height: 1.32;
      letter-spacing: 0.03em;
      color: var(--text-primary);
    }

    /* CTA Buttons */
    .cta-group {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    @media (max-width: 440px) {
      .cta-group {
        grid-template-columns: 1fr;
      }
    }

    .luxury-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      min-height: 52px;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      border: 1px solid rgba(201, 169, 110, 0.44);
      background: rgba(15, 14, 19, 0.72);
      color: var(--text-primary);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        color 0.4s var(--ease-out-expo),
        border-color 0.4s var(--ease-out-expo),
        box-shadow 0.4s var(--ease-out-expo),
        transform 0.25s ease-out;
    }

    /* Gold fill sweep on hover/tap */
    .luxury-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #d7b980 0%, #c9a96e 50%, #b38e4c 100%);
      transform: scaleX(0);
      transform-origin: right center;
      transition: transform 0.5s var(--ease-out-expo);
      z-index: 0;
    }

    .luxury-btn:hover::before,
    .luxury-btn:focus-visible::before,
    .luxury-btn:active::before {
      transform: scaleX(1);
      transform-origin: left center;
    }

    .luxury-btn:hover,
    .luxury-btn:focus-visible,
    .luxury-btn:active {
      color: #09080b;
      border-color: var(--gold-bright);
      box-shadow:
        0 0 26px rgba(201, 169, 110, 0.42),
        0 8px 22px -6px rgba(0, 0, 0, 0.65);
      outline: none;
    }

    .luxury-btn .btn-content {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      pointer-events: none;
    }

    .luxury-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
      transition: transform 0.35s var(--ease-out-expo);
    }

    .luxury-btn:hover svg {
      transform: scale(1.1);
    }

    /* Footer */
    .site-footer {
      width: 100%;
      text-align: center;
      padding-bottom: 0.2rem;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeSlideIn 1.4s var(--ease-out-expo) 1.4s forwards;
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .brand-title .char,
      .brand-subtitle,
      .card-perspective,
      .top-bar,
      .site-footer {
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }

      .gold-draw-line {
        transform: scaleX(1) !important;
        opacity: 1 !important;
      }

      #skyline-canvas {
        opacity: 1 !important;
      }

      .grain-overlay,
      .card-sheen {
        animation: none !important;
      }
    }
  </style>
</head>

              <a

                <span class="btn-content">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                  </svg>
                  <span>LINE</span>

  </div>

  <!-- Three.js Classic UMD Build from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      'use strict';

      var prefersReducedMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var isFinePointer = window.matchMedia &&
        window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var isMobile = window.innerWidth < 768 || !isFinePointer;

      /* --------------------------------------------------------
       * 1. Custom Smooth Cursor + Magnetic Buttons + Card 3D Tilt
       * -------------------------------------------------------- */
      var cursorDot = document.getElementById('cursor-dot');
      var cursorRing = document.getElementById('cursor-ring');
      var contactCard = document.getElementById('contact-card');
      var cardGlowSpot = document.getElementById('card-glow-spot');
      var buttons = document.querySelectorAll('.luxury-btn');

      var mouseX = window.innerWidth * 0.5;
      var mouseY = window.innerHeight * 0.5;
      var ringX = mouseX;
      var ringY = mouseY;
      var normX = 0; // -1 to 1
      var normY = 0; // -1 to 1

      if (isFinePointer && !prefersReducedMotion) {
        window.addEventListener('mousemove', function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
          normX = (e.clientX / window.innerWidth - 0.5) * 2;
          normY = (e.clientY / window.innerHeight - 0.5) * 2;

          if (cursorDot) {
            cursorDot.style.transform = 'translate3d(' + mouseX + 'px, ' + mouseY + 'px, 0)';
          }
        }, { passive: true });

        var updateCursorRing = function () {
          ringX += (mouseX - ringX) * 0.16;
          ringY += (mouseY - ringY) * 0.16;
          if (cursorRing) {
            cursorRing.style.transform = 'translate3d(' + ringX.toFixed(2) + 'px, ' + ringY.toFixed(2) + 'px, 0)';
          }
          requestAnimationFrame(updateCursorRing);
        };
        requestAnimationFrame(updateCursorRing);
      }

      /* Card 3D tilt & inner spotlight */
      if (contactCard && isFinePointer && !prefersReducedMotion) {
        contactCard.addEventListener('mousemove', function (e) {
          var rect = contactCard.getBoundingClientRect();
          var x = e.clientX - rect.left;
          var y = e.clientY - rect.top;
          var pctX = (x / rect.width) - 0.5;
          var pctY = (y / rect.height) - 0.5;
          var rotX = (-pctY * 10).toFixed(2);
          var rotY = (pctX * 12).toFixed(2);

          contactCard.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
          if (cardGlowSpot) {
            cardGlowSpot.style.setProperty('--spot-x', ((x / rect.width) * 100).toFixed(1) + '%');
            cardGlowSpot.style.setProperty('--spot-y', ((y / rect.height) * 100).toFixed(1) + '%');
          }
        }, { passive: true });

        contactCard.addEventListener('mouseleave', function () {
          contactCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });
      }

      /* Magnetic hover effect on CTA buttons */
      buttons.forEach(function (btn) {
        btn.addEventListener('mouseenter', function () {
          if (cursorRing) cursorRing.classList.add('is-hovering');
        });
        btn.addEventListener('mouseleave', function () {
          if (cursorRing) cursorRing.classList.remove('is-hovering');
          btn.style.transform = 'translate3d(0, 0, 0)';
        });
        if (isFinePointer && !prefersReducedMotion) {
          btn.addEventListener('mousemove', function (e) {
            var r = btn.getBoundingClientRect();
            var dx = e.clientX - (r.left + r.width * 0.5);
            var dy = e.clientY - (r.top + r.height * 0.5);
            btn.style.transform = 'translate3d(' + (dx * 0.22).toFixed(2) + 'px, ' + (dy * 0.28).toFixed(2) + 'px, 0)';
          }, { passive: true });
        }
      });

      /* --------------------------------------------------------
       * 2. Mobile Gyroscope / DeviceOrientation (iOS 13+ safe)
       * -------------------------------------------------------- */
      var gyroX = 0;
      var gyroY = 0;
      var gyroConnected = false;

      function attachOrientationListener() {
        if (gyroConnected) return;
        gyroConnected = true;
        window.addEventListener('deviceorientation', function (e) {
          if (e.gamma === null || e.beta === null) return;
          var clampedGamma = Math.max(-35, Math.min(35, e.gamma));
          var clampedBeta = Math.max(-35, Math.min(35, e.beta - 40));
          gyroX = clampedGamma / 35;
          gyroY = clampedBeta / 35;
        }, { passive: true });
      }

      if (typeof window.DeviceOrientationEvent !== 'undefined') {
        if (typeof window.DeviceOrientationEvent.requestPermission === 'function') {
          var requestIosGyro = function () {
            window.DeviceOrientationEvent.requestPermission()
              .then(function (state) {
                if (state === 'granted') {
                  attachOrientationListener();
                }
              })
              .catch(function () { /* gracefully ignore if declined */ });
            window.removeEventListener('touchend', requestIosGyro);
            window.removeEventListener('click', requestIosGyro);
          };
          window.addEventListener('touchend', requestIosGyro, { once: true, passive: true });
          window.addEventListener('click', requestIosGyro, { once: true, passive: true });
        } else {
          attachOrientationListener();
        }
      }

      /* --------------------------------------------------------
       * 3. Three.js 3D Bangkok Skyline Scene
       * -------------------------------------------------------- */
      var canvas = document.getElementById('skyline-canvas');
      if (!canvas || typeof window.THREE === 'undefined') {
        document.body.classList.add('webgl-fallback');
        return;
      }

      var renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: !isMobile,
          alpha: true,
          powerPreference: 'high-performance'
        });
      } catch (err) {
        document.body.classList.add('webgl-fallback');
        return;
      }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      var scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x060609, 0.032);

      var camera = new THREE.PerspectiveCamera(
        46,
        window.innerWidth / window.innerHeight,
        0.5,
        120
      );

      // Camera intro pull-back coordinates
      var camStartZ = isMobile ? 16.5 : 14.0;
      var camEndZ = isMobile ? 25.5 : 22.0;
      var camStartY = 4.2;
      var camEndY = 6.2;
      camera.position.set(0, camStartY, camStartZ);

      // Lighting: Dark atmospheric ambient + soft gold rim lights
      var ambientLight = new THREE.AmbientLight(0x181822, 1.3);
      scene.add(ambientLight);

      var rimLightGold = new THREE.DirectionalLight(0xc9a96e, 2.2);
      rimLightGold.position.set(14, 28, -16);
      scene.add(rimLightGold);

      var rimLightWarm = new THREE.PointLight(0xe5cb96, 2.4, 55, 1.6);
      rimLightWarm.position.set(0, 14, -8);
      scene.add(rimLightWarm);

      var coolFillLight = new THREE.DirectionalLight(0x28324a, 0.85);
      coolFillLight.position.set(-18, 10, 16);
      scene.add(coolFillLight);

      // Subtle reflective floor + architectural gold ground grid
      var floorGeo = new THREE.PlaneGeometry(160, 160);
      var floorMat = new THREE.MeshStandardMaterial({
        color: 0x050507,
        roughness: 0.18,
        metalness: 0.88
      });
      var floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      var gridHelper = new THREE.GridHelper(90, isMobile ? 36 : 54, 0xc9a96e, 0xc9a96e);
      gridHelper.position.y = 0.01;
      gridHelper.material.transparent = true;
      gridHelper.material.opacity = 0.08;
      scene.add(gridHelper);

      // Procedural window texture for black glass towers
      function createTowerTexture(seed) {
        var c = document.createElement('canvas');
        c.width = 64;
        c.height = 256;
        var ctx = c.getContext('2d');

        ctx.fillStyle = '#07070b';
        ctx.fillRect(0, 0, c.width, c.height);

        // Subtle vertical mullions
        ctx.fillStyle = 'rgba(201, 169, 110, 0.05)';
        for (var gx = 0; gx < c.width; gx += 8) {
          ctx.fillRect(gx, 0, 1, c.height);
        }

        // Sparse warm lit luxury penthouse/condo windows
        var s = seed * 9301 + 49297;
        var rand = function () {
          s = (s * 9301 + 49297) % 233280;
          return s / 233280;
        };

        for (var row = 4; row < c.height - 8; row += 6) {
          for (var col = 2; col < c.width - 4; col += 8) {
            var r = rand();
            if (r > 0.915) {
              var alpha = 0.45 + rand() * 0.5;
              ctx.fillStyle = r > 0.965
                ? 'rgba(248, 224, 176, ' + alpha.toFixed(2) + ')'
                : 'rgba(201, 169, 110, ' + (alpha * 0.78).toFixed(2) + ')';
              ctx.fillRect(col, row, 5, 2.5);
            }
          }
        }

        var tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      var towerTextures = [
        createTowerTexture(1),
        createTowerTexture(2),
        createTowerTexture(3),
        createTowerTexture(4)
      ];

      var towerMaterials = towerTextures.map(function (tex) {
        return new THREE.MeshStandardMaterial({
          color: 0x08080d,
          roughness: 0.14,
          metalness: 0.92,
          emissive: 0xc9a96e,
          emissiveMap: tex,
          emissiveIntensity: 0.95
        });
      });

      var roofCapMat = new THREE.MeshStandardMaterial({
        color: 0x060609,
        roughness: 0.25,
        metalness: 0.85
      });

      var edgeMatBright = new THREE.LineBasicMaterial({
        color: 0xc9a96e,
        transparent: true,
        opacity: 0.52
      });

      var edgeMatSoft = new THREE.LineBasicMaterial({
        color: 0xc9a96e,
        transparent: true,
        opacity: 0.22
      });

      var reflectionEdgeMat = new THREE.LineBasicMaterial({
        color: 0xc9a96e,
        transparent: true,
        opacity: 0.08
      });

      // Build Bangkok Skyline Group
      var skylineGroup = new THREE.Group();
      scene.add(skylineGroup);

      var towerCount = isMobile ? 28 : 48;
      var dSeed = 1337;
      function nextRand() {
        dSeed = (dSeed * 16807) % 2147483647;
        return (dSeed - 1) / 2147483646;
      }

      function addTowerSection(w, h, d, x, y, z, matIndex, isCrown) {
        var geo = new THREE.BoxGeometry(w, h, d);
        var sideMat = towerMaterials[matIndex % towerMaterials.length];
        var mats = [sideMat, sideMat, roofCapMat, roofCapMat, sideMat, sideMat];
        var mesh = new THREE.Mesh(geo, mats);
        mesh.position.set(x, y, z);
        skylineGroup.add(mesh);

        var edges = new THREE.EdgesGeometry(geo);
        var line = new THREE.LineSegments(edges, isCrown ? edgeMatBright : edgeMatSoft);
        line.position.copy(mesh.position);
        skylineGroup.add(line);

        // Subtle mirrored wireframe reflection beneath the glossy floor
        if (y - h * 0.5 < 0.2) {
          var reflLine = new THREE.LineSegments(edges, reflectionEdgeMat);
          reflLine.position.set(x, -y, z);
          skylineGroup.add(reflLine);
        }
      }

      for (var i = 0; i < towerCount; i++) {
        // Arrange towers across the horizon with an architectural focal cluster
        var spread = (i / (towerCount - 1) - 0.5) * 2; // -1 to 1
        var x = spread * (isMobile ? 22 : 32) + (nextRand() - 0.5) * 2.4;
        var z = -2.5 - Math.pow(Math.abs(spread), 0.85) * 10 - nextRand() * 14;

        var distFromCenter = Math.abs(x);
        var centrality = Math.max(0.15, 1 - distFromCenter / 26);

        var w = 0.85 + nextRand() * 1.45;
        var d = 0.85 + nextRand() * 1.45;
        var h = (3.8 + nextRand() * 11.5) * (0.55 + centrality * 0.65);

        // Hero supertall landmarks near center-back
        if (i % 7 === 0 && distFromCenter < 11) {
          h *= 1.32;
        }

        var matIdx = i % towerMaterials.length;
        addTowerSection(w, h, d, x, h * 0.5, z, matIdx, i % 3 === 0);

        // Stepped architectural setback / crown tier (classic Bangkok luxury high-rise silhouette)
        if (h > 8.5 && nextRand() > 0.35) {
          var crownW = w * 0.68;
          var crownD = d * 0.68;
          var crownH = 1.4 + nextRand() * 2.4;
          addTowerSection(crownW, crownH, crownD, x, h + crownH * 0.5, z, matIdx, true);

          // Fine gold spire on select flagship towers
          if (nextRand() > 0.55) {
            var spireGeo = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(x, h + crownH, z),
              new THREE.Vector3(x, h + crownH + 1.8 + nextRand() * 1.5, z)
            ]);
            var spire = new THREE.Line(spireGeo, edgeMatBright);
            skylineGroup.add(spire);
          }
        }
      }

      // Warm glowing penthouse sky-lounges (featured lit horizontal bands)
      var skyLoungeMat = new THREE.MeshBasicMaterial({
        color: 0xe8cc94,
        transparent: true,
        opacity: 0.78
      });
      for (var k = 0; k < (isMobile ? 6 : 12); k++) {
        var lx = (nextRand() - 0.5) * 18;
        var lz = -4 - nextRand() * 11;
        var ly = 5.5 + nextRand() * 7.5;
        var loungeGeo = new THREE.BoxGeometry(0.95, 0.11, 0.95);
        var loungeMesh = new THREE.Mesh(loungeGeo, skyLoungeMat);
        loungeMesh.position.set(lx, ly, lz);
        skylineGroup.add(loungeMesh);
      }

      // Floating fine gold dust particles
      var particleCount = isMobile ? 130 : 280;
      var particleGeo = new THREE.BufferGeometry();
      var positions = new Float32Array(particleCount * 3);
      var speeds = new Float32Array(particleCount);
      var phases = new Float32Array(particleCount);

      for (var p = 0; p < particleCount; p++) {
        positions[p * 3] = (nextRand() - 0.5) * 38;
        positions[p * 3 + 1] = nextRand() * 18 + 0.3;
        positions[p * 3 + 2] = (nextRand() - 0.5) * 28 + 2;
        speeds[p] = 0.006 + nextRand() * 0.014;
        phases[p] = nextRand() * Math.PI * 2;
      }

      particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      // Soft circular gold particle sprite
      var spriteCanvas = document.createElement('canvas');
      spriteCanvas.width = 32;
      spriteCanvas.height = 32;
      var sCtx = spriteCanvas.getContext('2d');
      var grad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255, 240, 205, 1)');
      grad.addColorStop(0.35, 'rgba(201, 169, 110, 0.75)');
      grad.addColorStop(1, 'rgba(201, 169, 110, 0)');
      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, 32, 32);

      var particleTex = new THREE.CanvasTexture(spriteCanvas);
      var particleMat = new THREE.PointsMaterial({
        map: particleTex,
        size: isMobile ? 0.24 : 0.2,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      var goldDust = new THREE.Points(particleGeo, particleMat);
      scene.add(goldDust);

      // Reveal canvas smoothly
      requestAnimationFrame(function () {
        canvas.classList.add('is-ready');
      });

      // Handle viewport resize
      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, { passive: true });

      // If reduced motion is preferred, render static frame at final camera position
      if (prefersReducedMotion) {
        camera.position.set(0, camEndY, camEndZ);
        camera.lookAt(0, 4.8, -6);
        renderer.render(scene, camera);
        return;
      }

      // Animation loop: ~3s intro camera pull-back + slow cinematic drift + parallax + dust
      var startTime = performance.now();
      var introDuration = 3100; // ms
      var currentParallaxX = 0;
      var currentParallaxY = 0;

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animate(now) {
        requestAnimationFrame(animate);

        var elapsed = now - startTime;
        var t = elapsed * 0.001;

        // Intro pull-back over ~3 seconds
        var introProgress = Math.min(1, elapsed / introDuration);
        var introEase = easeOutCubic(introProgress);
        var baseZ = camStartZ + (camEndZ - camStartZ) * introEase;
        var baseY = camStartY + (camEndY - camStartY) * introEase;

        // Combine desktop mouse and mobile gyroscope input
        var targetInputX = isFinePointer ? normX : gyroX;
        var targetInputY = isFinePointer ? normY : gyroY;

        currentParallaxX += (targetInputX - currentParallaxX) * 0.045;
        currentParallaxY += (targetInputY - currentParallaxY) * 0.045;

        // Slow cinematic camera drift + interactive parallax
        var driftX = Math.sin(t * 0.18) * 1.35;
        var driftY = Math.cos(t * 0.14) * 0.35;
        var driftZ = Math.sin(t * 0.11) * 0.65;

        camera.position.x = driftX + currentParallaxX * 2.2;
        camera.position.y = Math.max(2.2, baseY + driftY - currentParallaxY * 0.9);
        camera.position.z = baseZ + driftZ;

        camera.lookAt(
          currentParallaxX * 0.7,
          4.7 - currentParallaxY * 0.4,
          -6
        );

        // Update floating gold dust particles
        var posAttr = particleGeo.attributes.position;
        var arr = posAttr.array;
        for (var i = 0; i < particleCount; i++) {
          var idx = i * 3;
          arr[idx + 1] += speeds[i];
          arr[idx] += Math.sin(t * 0.6 + phases[i]) * 0.003;
          if (arr[idx + 1] > 18.5) {
            arr[idx + 1] = 0.2;
          }
        }
        posAttr.needsUpdate = true;

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    })();
  </script>
