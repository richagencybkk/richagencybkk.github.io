<style>

*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#050505;--ink:#f4f4f2;--mute:#8d8d89;
  --glass:rgba(255,255,255,.07);--glass-hi:rgba(255,255,255,.16);--line:rgba(255,255,255,.18);

  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#c{position:fixed;inset:0;width:100%;height:100vh;height:100lvh;display:block;z-index:0}
.shade{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(5,5,5,.55),transparent 22%,transparent 62%,rgba(5,5,5,.75))}

.lang{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:5;display:inline-flex;padding:4px;gap:2px;border-radius:999px;border:1px solid var(--line);background:rgba(10,10,10,.45);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lang button{font:500 12px/1 var(--body);color:var(--mute);background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

main{position:relative;z-index:2}
.sec{min-height:100vh;min-height:100svh;max-width:460px;margin:0 auto;padding:calc(72px + env(safe-area-inset-top,0px)) 20px calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}

.hero{justify-content:flex-start;text-align:center}
h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,16vw,76px);line-height:.88;letter-spacing:.02em;text-transform:uppercase;margin:0;

.sub{margin:10px 0 0;color:var(--mute);font-size:15px;line-height:1.5}
.sub strong{color:var(--ink);font-weight:500}
.cue{margin-top:auto;align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cue i{width:1px;height:34px;background:linear-gradient(var(--ink),transparent);animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.tower{justify-content:flex-end;min-height:55vh;min-height:55svh;padding-top:24px;padding-bottom:24px}
.cap{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(10,10,10,.42);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-self:flex-start;

.cap.on{opacity:1;transform:none}
.cap.fixed{position:fixed;z-index:3;left:20px;bottom:calc(32px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cap small{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cap b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.03em;text-transform:uppercase}

.contact{justify-content:flex-end;gap:12px}
.contact .cap{align-self:stretch;text-align:center}
.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;text-decoration:none;color:var(--ink);
  background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.06) 55%);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 40px -18px rgba(0,0,0,.9);transition:background .25s,transform .15s}
.btn:hover{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.09) 55%)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.ico svg{width:26px;height:26px}
.lbl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lbl b{font-size:17px;font-weight:700}
.lbl span{font-family:var(--mono);font-size:13px;color:var(--mute)}
.copy{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(10,10,10,.45);color:var(--ink);font:inherit;cursor:pointer;text-align:left;min-width:0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip small{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.chip span{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.chip.ok small{color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

html[lang="th"] body,html[lang="th"] .sub,html[lang="th"] .lbl b{font-family:"IBM Plex Sans Thai",var(--body)}
html[lang="th"] .chip small,html[lang="th"] .cap small,html[lang="th"] .cue{font-family:"IBM Plex Sans Thai",var(--mono);letter-spacing:.02em}

 const NX=8,NZ=8,NY=60,cs=1/8,ch=.1,ox=-.5,oz=-.5;

 const P=[];for(let x=0;x<8;x++)P.push([x,0]);for(let z=1;z<8;z++)P.push([7,z]);for(let x=6;x>=0;x--)P.push([x,7]);for(let z=6;z>=1;z--)P.push([0,z]);
 const inner=([x,z])=>[x===0?1:x===7?6:x,z===0?1:z===7?6:z];
 const Y0=18,NP=P.length;
 for(let y=Y0;y<NY;y++){const c=((y-Y0)/(NY-Y0))*(NP+1)+4;
   for(let p=0;p<NP;p++){let d=Math.abs(p-(c%NP));d=Math.min(d,NP-d);const r=hash(y,p,1);
     if(d<1.6||(d<2.9&&r>.5)||(d<3.9&&r>.85)){const [x,z]=P[p];S[id(x,y,z)]=0;if(d<1.1&&r>.3){const [a,b]=inner(P[p]);S[id(a,y,b)]=0}}}}
 const at=(x,y,z)=>x>=0&&x<NX&&y>=0&&y<NY&&z>=0&&z<NZ&&S[id(x,y,z)];
 const inb=(x,y,z)=>x>=0&&x<NX&&y>=0&&y<NY&&z>=0&&z<NZ;
 const D=[NX,NY,NZ],OUT=[],REC=[];
 for(let a=0;a<3;a++){const u=(a+1)%3,v=(a+2)%3;
   for(const sg of [1,-1])for(let k=0;k<D[a];k++){
     const M=new Int8Array(D[u]*D[v]);
     for(let i=0;i<D[u];i++)for(let j=0;j<D[v];j++){const p=[0,0,0];p[a]=k;p[u]=i;p[v]=j;if(!at(...p))continue;const q=[...p];q[a]+=sg;if(at(...q))continue;if(!inb(...q)&&a===1&&sg<0)continue;M[i*D[v]+j]=inb(...q)?2:1}
     for(let i=0;i<D[u];i++)for(let j=0;j<D[v];){const c=M[i*D[v]+j];if(!c){j++;continue}
       let w=1;while(j+w<D[v]&&M[i*D[v]+j+w]===c)w++;
       let h=1;grow:while(i+h<D[u]){for(let m=0;m<w;m++)if(M[(i+h)*D[v]+j+m]!==c)break grow;h++}
       for(let r=0;r<h;r++)for(let m=0;m<w;m++)M[(i+r)*D[v]+j+m]=0;
       const pl=k+(sg>0?1:0);
       const cor=(uu,vv)=>{const p=[0,0,0];p[a]=pl;p[u]=uu;p[v]=vv;return[ox+p[0]*cs,p[1]*ch,oz+p[2]*cs]};
       let q=[cor(i,j),cor(i+h,j),cor(i+h,j+w),cor(i,j+w)];if(sg<0)q=[q[0],q[3],q[2],q[1]];
       (c===1?OUT:REC).push(q[0],q[1],q[2],q[0],q[2],q[3]);j+=w;}
   }}
 const geo=arr=>{const g2=new THREE.BufferGeometry();g2.setAttribute('position',new THREE.Float32BufferAttribute(arr.flat(),3));g2.computeVertexNormals();return g2};
 g.add(new THREE.Mesh(geo(OUT),MAT.glass));
 const rg=geo(REC);g.add(new THREE.Mesh(rg,MAT.dark));
 edges(mergeVertices(rg,1e-4),g,MAT.edgeSoft,1);
 const L=[];
 [[0,0],[7,0],[7,7],[0,7]].forEach(([x,z])=>{const wx=ox+(x?NX:0)*cs,wz=oz+(z?NZ:0)*cs;let s=-1;
   for(let y=0;y<=NY;y++){const on=y<NY&&at(x,y,z);if(on&&s<0)s=y;if(!on&&s>=0){L.push([[wx,s*ch,wz],[wx,y*ch,wz]]);s=-1}}});
 P.forEach(([x,z])=>{if(!at(x,NY-1,z))return;const x0=ox+x*cs,z0=oz+z*cs,y=NY*ch;
   if(z===0)L.push([[x0,y,z0],[x0+cs,y,z0]]);if(z===7)L.push([[x0,y,z0+cs],[x0+cs,y,z0+cs]]);
   if(x===0)L.push([[x0,y,z0],[x0,y,z0+cs]]);if(x===7)L.push([[x0+cs,y,z0],[x0+cs,y,z0+cs]])});
 lines(L,MAT.edge,g);
 box(.92,.2,.92,0,6.0,0,MAT.glassHi,g);
 box(.96,.03,.96,0,6.2,0,MAT.glow,g,null);
 box(.4,.06,.4,0,6.23,0,MAT.stone,g);
 beacon(0,6.34,0,g);
 label(g,0,6.5,0,'MahaNakhon','มหานคร');}

/* ---------- Baiyoke Tower II (304 m): stepped shaft, dark spine, rotating Thai-flag LED ring ---------- */
let flagTex,flagCtx;
{const g=grp(2.5,.5,1,0,.3);
 [[1.75,1.4,.16,0,.55],[1.5,1.22,.15,.55,1.25],[1.18,1.02,.13,1.25,2.45],[1.0,.92,.12,2.45,4.35],[.9,.84,.11,4.35,5.6]]
   .forEach(([w,d,k,a,b])=>{mesh(ext(notchS(w,d,k),a,b),MAT.glass,g);floors(notchS(w,d,k),a,b,.1,g)});
 box(.2,3.0,.94,0,2.6,0,MAT.dark,g,MAT.edgeSoft);
 box(.92,2.2,.15,0,3.4,0,MAT.dark,g,MAT.edgeSoft);
 [-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.ConeGeometry(.15,.32,4,1),MAT.goldFlat);c.rotation.y=Math.PI/4;c.position.set(0,2.6,s*.48);g.add(c);
   const c2=c.clone();c2.position.set(0,5.42,s*.43);c2.scale.setScalar(.8);g.add(c2)});
 box(.86,.08,.82,0,5.6,0,MAT.stone,g);
 cyl(.4,.4,5.68,5.85,40,MAT.dark,g,{edge:MAT.edgeSoft});
 const c=document.createElement('canvas');c.width=1024;c.height=96;flagCtx=c.getContext('2d');
 flagTex=new THREE.CanvasTexture(c);flagTex.colorSpace=THREE.SRGBColorSpace;flagTex.wrapS=THREE.RepeatWrapping;flagTex.anisotropy=4;
 const ring=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.2,96,1,true),new THREE.MeshBasicMaterial({map:flagTex,toneMapped:false,side:THREE.DoubleSide}));
 ring.position.y=5.95;g.add(ring);
 [5.85,6.05].forEach(y=>{const t=new THREE.Mesh(new THREE.TorusGeometry(.435,.008,8,96),MAT.glow);t.rotation.x=Math.PI/2;t.position.y=y;g.add(t)});
 cyl(.41,.41,6.05,6.1,40,MAT.stone,g);
 const dome=new THREE.Mesh(new THREE.SphereGeometry(.41,48,24,0,Math.PI*2,0,Math.PI/2),MAT.gold);dome.scale.y=.55;dome.position.y=6.1;g.add(dome);
 cyl(.04,.02,6.3,6.68,10,MAT.stone,g);
 [6.42,6.53].forEach(y=>box(.18,.02,.02,0,y,0,MAT.stone,g,null));
 beacon(0,6.7,0,g);
 label(g,0,6.85,0,'Baiyoke Tower II','ใบหยก 2');}
function drawFlag(t){
  const x=flagCtx,W=1024,H=96,n=4,cols=[ '#a51931','#f4f5f8','#2d2a4a','#f4f5f8','#a51931'],cut=[0,1,2,4,5,6];
  x.fillStyle='#050507';x.fillRect(0,0,W,H);
  for(let px=0;px<W;px+=2){
    const q=((px/W)*n+t*.18)%1;if(q>.94)continue;
    const wv=Math.sin(q*Math.PI*2*1.2-t*3.2)*H*.05,sh=1-.18*(.5+.5*Math.sin(q*Math.PI*2*1.2-t*3.2+1.2));
    for(let s=0;s<5;s++){const y0=cut[s]/6*H+(s?wv:0),y1=cut[s+1]/6*H+(s<4?wv:0);x.fillStyle=cols[s];x.globalAlpha=sh;x.fillRect(px,y0,2.2,y1-y0)}
    x.globalAlpha=1;
  }
  flagTex.needsUpdate=true;
}

/* ---------- Flagpole with waving Thai flag (centre) ---------- */
let FLAG=null;
{const g=grp(.2,-1.5,1,Math.PI,.45);
 cyl(.62,.62,0,.12,48,MAT.stone,g,{edge:MAT.edgeSoft});
 cyl(.46,.46,.12,.24,48,MAT.stone,g,{edge:MAT.edgeSoft});
 cyl(.3,.3,.24,.36,40,MAT.dark,g,{edge:MAT.edgeSoft});
 cyl(.075,.045,.36,5.5,32,MAT.stone,g);
 [.36,2.0,3.6].forEach(y=>cyl(.085,.085,y,y+.04,24,MAT.gold,g));
 cyl(.06,.06,5.5,5.56,24,MAT.gold,g);
 const ball=new THREE.Mesh(new THREE.SphereGeometry(.09,32,16),MAT.gold);ball.position.y=5.64;g.add(ball);
 beacon(0,5.76,0,g,true);
 const c=document.createElement('canvas');c.width=600;c.height=400;const x=c.getContext('2d');
 [['#a51931',0,1],['#f4f5f8',1,2],['#2d2a4a',2,4],['#f4f5f8',4,5],['#a51931',5,6]].forEach(([col,a,b])=>{x.fillStyle=col;x.fillRect(0,a/6*400,600,(b-a)/6*400)});
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
 const geo=new THREE.PlaneGeometry(1.6,1.07,48,24);geo.translate(.8,0,0);
 const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:.7,metalness:0,envMapIntensity:.6}));
 m.position.set(.07,4.9,0);g.add(m);
 FLAG={geo,base:Float32Array.from(geo.attributes.position.array)};}
function waveFlag(t){if(!FLAG)return;const p=FLAG.geo.attributes.position,b=FLAG.base;
 for(let k=0;k<p.count;k++){const x=b[k*3],y=b[k*3+1],f=x/1.6;
   p.array[k*3+2]=Math.sin(x*2.6-t*4.2+y*.6)*.16*f+Math.sin(x*5.1-t*6.3)*.035*f;
   p.array[k*3+1]=y-f*f*.08+Math.sin(x*2-t*3)*.03*f;}
 p.needsUpdate=true;FLAG.geo.computeVertexNormals();}

/* ---------- ground: dark plinth, faint grid, soft reflection ---------- */
{const g=new THREE.Mesh(new THREE.CircleGeometry(14,96),new THREE.MeshPhysicalMaterial({color:0x07070a,metalness:.6,roughness:.35,envMapIntensity:.3}));g.rotation.x=-Math.PI/2;g.position.y=-.01;scene.add(g);
 const grid=new THREE.GridHelper(28,56,0x1a1a1f,0x0f0f12);scene.add(grid);
 const ring=new THREE.Mesh(new THREE.RingGeometry(13.9,14,128),new THREE.MeshBasicMaterial({color:0x2a2a30}));ring.rotation.x=-Math.PI/2;ring.position.y=.005;scene.add(ring);}

/* ---------- camera path driven by scroll ---------- */
const TWR={m:new THREE.Vector3(-2.1,0,.7),b:new THREE.Vector3(2.5,0,.5),s:new THREE.Vector3(.2,0,-1.5)};
// [camera position, look target] for each section: hero, MahaNakhon, Baiyoke, State, contact
const KEYS=[
  [[0,3.6,16],[0,3.0,-.2]],
  [[TWR.m.x-2.6,4.6,TWR.m.z+3.4],[TWR.m.x,4.3,TWR.m.z]],
  [[TWR.b.x+2.9,5.9,TWR.b.z+3.3],[TWR.b.x,5.2,TWR.b.z]],
  [[TWR.s.x+.4,4.7,TWR.s.z+7.8],[TWR.s.x-.7,4.1,TWR.s.z]],
  [[-6,11,17],[0,4.2,-.2]],
];
const posCurve=new THREE.CatmullRomCurve3(KEYS.map(k=>new THREE.Vector3(...k[0])),false,'centripetal');
const tgtCurve=new THREE.CatmullRomCurve3(KEYS.map(k=>new THREE.Vector3(...k[1])),false,'centripetal');
const N=KEYS.length-1;

// widen the wide shots on narrow (portrait) screens so all three towers fit
function widen(p,t,u){
  const wide=Math.max(1-u*1.6,0)+Math.max((u-.82)/.18,0);if(!wide)return;
  const hf=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*camera.aspect);
  const need=4.4/Math.tan(hf/2),d=p.distanceTo(t);
  if(need>d)p.sub(t).multiplyScalar(1+(need/d-1)*Math.min(wide,1)).add(t);
}

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.42,.45,.88);composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);bloom.setSize(w/2,h/2);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();addEventListener('resize',resize);

const SECS=[...document.querySelectorAll('main > .sec')];
// piecewise: each section's top marks one camera keyframe, so short sections still land exactly on their shot
function progress(){const max=document.documentElement.scrollHeight-innerHeight;if(max<=0)return 0;
  const stops=SECS.map((el,i)=>i===SECS.length-1?max:Math.min(max,el.offsetTop));const y=Math.min(max,Math.max(0,scrollY));
  for(let i=0;i<stops.length-1;i++){if(y<=stops[i+1]){const span=stops[i+1]-stops[i];return(i+(span>0?(y-stops[i])/span:1))/(stops.length-1)}}return 1}
let u=progress();
const P=new THREE.Vector3(),T=new THREE.Vector3(),clock=new THREE.Clock();
const ease=t=>1-Math.pow(1-t,3);
function frame(){
  const t=clock.getElapsedTime();
  BUILD.forEach(b=>{if(reduce)return;const k=Math.min(1,Math.max(0,(t-b.delay)/1.4));b.g.scale.y=Math.max(.001,ease(k))});
  drawFlag(reduce?0:t);waveFlag(reduce?.6:t);
  BEACONS.forEach((m,i)=>{const p=reduce?1:.55+.45*Math.max(0,Math.sin(t*2.6+i));m.material.opacity=p;m.material.transparent=true;m.scale.setScalar(.8+p*.6)});
  const goal=progress();u+=reduce?goal-u:(goal-u)*.1;
  {const k=Math.round(goal*N),near=Math.abs(goal*N-k)<.35?k:0;if(near!==frame.cap){frame.cap=near;setCap(near)}}
  posCurve.getPoint(u,P);tgtCurve.getPoint(u,T);
  if(!reduce){const s=Math.sin(t*.35)*.35;P.x+=s;P.y+=Math.sin(t*.27)*.12}
  widen(P,T,u);
  camera.position.copy(P);camera.lookAt(T);
  composer.render();
  requestAnimationFrame(frame);
}
drawFlag(0);requestAnimationFrame(frame);
