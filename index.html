<style>
/* Layout: one narrow column — 3D glass tower on canvas, name, two glass contact buttons, IDs to copy. Single committed black & white look. */
:root{
  --bg:#050505;
  --ink:#f4f4f2;
  --mute:#8d8d89;
  --glass:rgba(255,255,255,.07);
  --glass-hi:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.18);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);min-height:100%;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 50% 18%,rgba(255,255,255,.10),transparent 70%),
    radial-gradient(40% 30% at 85% 90%,rgba(255,255,255,.05),transparent 70%);}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-inline:20px;padding-block:12px 40px;display:flex;flex-direction:column;gap:22px}

.stage{position:relative;height:min(470px,64vh);min-height:340px;border-radius:32px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px -30px rgba(0,0,0,.9);}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage .hint{position:absolute;bottom:14px;left:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);pointer-events:none;transition:opacity .6s}
.stage .reset{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.stage .reset svg{width:16px;height:16px}
.stage .reset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.stage .tag{position:absolute;top:16px;left:18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stage .tag b{color:var(--ink);font-weight:500}
.stage .coord{position:absolute;top:34px;left:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute)}

.id{display:flex;flex-direction:column;gap:6px;text-align:center}
h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,64px);line-height:.9;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;
  background:linear-gradient(180deg,#fff 30%,#9a9a96);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--mute);font-size:15px;line-height:1.5}
.sub strong{color:var(--ink);font-weight:500}

.btns{display:flex;flex-direction:column;gap:14px;perspective:800px}
.btn{--rx:0deg;--ry:0deg;position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:24px;text-decoration:none;color:var(--ink);
  background:linear-gradient(135deg,var(--glass-hi),var(--glass) 55%);
  border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 40px -18px rgba(0,0,0,.9);
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease,background .25s ease;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);
  transform:translateX(-120%);animation:sheen 5.5s ease-in-out infinite}
.btn:nth-child(2)::after{animation-delay:1.2s}
@keyframes sheen{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.btn:hover{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08) 55%)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--ink);color:var(--bg);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 6px 14px -6px rgba(255,255,255,.4)}
.ico svg{width:28px;height:28px}
.lbl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lbl b{font-size:18px;font-weight:700;letter-spacing:.01em}
.lbl span{font-family:var(--mono);font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.arr{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.arr svg{width:14px;height:14px}

.copy{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;cursor:pointer;text-align:left;min-width:0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.chip span{font-family:var(--mono);font-size:13px;user-select:all;overflow-wrap:anywhere}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip.ok small{color:var(--ink)}
.foot{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}

.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
@keyframes rise{from{transform:translateY(14px);filter:blur(6px)}to{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.btn::after,.rise{animation:none}}
.lang{align-self:center;display:inline-flex;padding:4px;gap:2px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.lang button{font:500 13px/1 var(--body);color:var(--mute);background:none;border:0;padding:9px 18px;border-radius:999px;cursor:pointer;letter-spacing:.04em;transition:background .25s,color .25s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
html[lang="th"] body,html[lang="th"] .sub,html[lang="th"] .lbl b{font-family:"IBM Plex Sans Thai",var(--body)}
html[lang="th"] .chip small,html[lang="th"] .stage .tag,html[lang="th"] .stage .hint,html[lang="th"] .foot{font-family:"IBM Plex Sans Thai",var(--mono);letter-spacing:.02em}
</style>

      <span class="lbl"><b data-i="wa">Chat on WhatsApp</b><span>+66 91 815 7214</span></span>

<script>
const I18N={
  en:{tag:'<b>Bangkok</b> · Skyline',hint:'Drag to rotate · Pinch to zoom',sub:'Condos for <strong>rent &amp; sale</strong> in Bangkok.<br>Message me and I’ll send you the best options.',wa:'Chat on WhatsApp',line:'Add me on LINE',cpwa:'Copy WhatsApp',cpline:'Copy LINE ID',copied:'Copied',foot:'Bangkok · Sukhumvit · Sathorn · Rama 9'},
  th:{tag:'<b>กรุงเทพฯ</b> · สกายไลน์',hint:'ลากเพื่อหมุน · ถ่างนิ้วเพื่อซูม',sub:'คอนโด<strong>ให้เช่าและขาย</strong>ในกรุงเทพฯ<br>ทักมาได้เลย ผมจะส่งห้องที่ดีที่สุดให้',wa:'แชทผ่าน WhatsApp',line:'เพิ่มเพื่อนทาง LINE',cpwa:'คัดลอก WhatsApp',cpline:'คัดลอก LINE ID',copied:'คัดลอกแล้ว',foot:'กรุงเทพฯ · สุขุมวิท · สาทร · พระราม 9'}
};
let LANG='en';
function setLang(l){
  LANG=l;document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=I18N[l][el.dataset.i]});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===l)));
  if(window.SKY) SKY.setLang(l);
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));

document.querySelectorAll('.chip').forEach(b=>{
  b.addEventListener('click',()=>{
    const v=b.dataset.v,s=b.querySelector('small');
    const done=()=>{b.classList.add('ok');s.textContent=I18N[LANG].copied;setTimeout(()=>{b.classList.remove('ok');s.innerHTML=I18N[LANG][s.dataset.i]},1600)};
    try{navigator.clipboard.writeText(v).then(done,()=>sel(b))}catch(e){sel(b)}
  });
});
function sel(b){const r=document.createRange();r.selectNodeContents(b.querySelector('span'));const g=getSelection();g.removeAllRanges();g.addRange(r)}

document.querySelectorAll('.btn').forEach(el=>{
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.setProperty('--ry',(x*10)+'deg');el.style.setProperty('--rx',(-y*10)+'deg')});
  el.addEventListener('pointerleave',()=>{el.style.setProperty('--ry','0deg');el.style.setProperty('--rx','0deg')});
});

/* 3D glass Bangkok landmarks — real heights (1 unit = 50 m). Drag to orbit, pinch / wheel to zoom */
window.SKY=(()=>{
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,lang='en';
  function size(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);

  const hash=(a,b,c)=>{const h=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5;return h-Math.floor(h)};
  const PL=[],LN=[],LB=[],BEACONS=[];
  let pid=0;
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

  /* group transform: place a building at (X,Z), scale s, rotate r */
  let G={X:0,Z:0,s:1,c:1,n:0};
  const grp=(X,Z,s=1,r=0)=>{G={X,Z,s,c:Math.cos(r),n:Math.sin(r)}};
  const T=(x,y,z)=>[G.X+(x*G.c-z*G.n)*G.s,y*G.s,G.Z+(x*G.n+z*G.c)*G.s];

  function poly(pts,ctr,o={}){
    let n=crs(sub(pts[1],pts[0]),sub(pts[2],pts[0]));
    if(Math.hypot(...n)<1e-9&&pts.length>3) n=crs(sub(pts[2],pts[0]),sub(pts[3],pts[0]));
    const l=Math.hypot(...n)||1;n=n.map(v=>v/l);
    const c=pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length,a[2]+p[2]/pts.length],[0,0,0]);
    if(dot(n,sub(c,ctr))<0) n=n.map(v=>-v);
    PL.push({pts,n,id:pid++,ymin:Math.min(...pts.map(p=>p[1])),...o});
  }
  const line=(a,b,al=.5,w=1)=>{const A=T(...a),B=T(...b);LN.push({a:A,b:B,al,w,ymin:Math.min(A[1],B[1])})};
  const label=(x,y,z,en,th)=>LB.push({p:T(x,y,z),en,th});
  const beacon=(x,y,z)=>BEACONS.push(T(x,y,z));

  function prism(cx,cz,C,y0,y1,ts=1,o={}){
    const sx=o.sx||0,sz=o.sz||0,n=C.length;
    const ctr=T(cx+sx/2,(y0+y1)/2,cz+sz/2);
    const B=C.map(([x,z])=>T(cx+x,y0,cz+z));
    const U=C.map(([x,z])=>T(cx+sx+x*ts,y1,cz+sz+z*ts));
    for(let i=0;i<n;i++){const j=(i+1)%n;poly([B[i],B[j],U[j],U[i]],ctr,{k:o.k||'glass',fi:i,fn:n,quad:1})}
    if(o.top!==false&&ts>.02) poly(U,ctr,{k:o.tk||o.k||'glass',top:1});
  }
  const R=(w,d)=>[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]];
  const EL=(rx,rz,n)=>{const C=[];for(let i=0;i<n;i++){const a=(i+.5)/n*Math.PI*2;C.push([Math.cos(a)*rx,Math.sin(a)*rz])}return C};
  const NOTCH=(w,d,k)=>{const a=w/2,b=d/2;return[[-a+k,-b],[a-k,-b],[a-k,-b+k],[a,-b+k],[a,b-k],[a-k,b-k],[a-k,b],[-a+k,b],[-a+k,b-k],[-a,b-k],[-a,-b+k],[-a+k,-b+k]]};
  const OCT=(s,c)=>{const h=s/2;return[[-h+c,-h],[h-c,-h],[h,-h+c],[h,h-c],[h-c,h],[-h+c,h],[-h,h-c],[-h,-h+c]]};
  const box=(cx,cz,w,d,y0,y1,o)=>prism(cx,cz,R(w,d),y0,y1,1,o);
  const cyl=(cx,cz,r,n,y0,y1,ts,o)=>prism(cx,cz,EL(r,r,n),y0,y1,ts,o);
  function gable(cx,cz,len,wid,y0,h,ax,o={}){
    const L=len/2,Wd=wid/2;
    const P=(a,b,y)=>ax==='x'?T(cx+a,y,cz+b):T(cx+b,y,cz+a);
    const ctr=P(0,0,y0+h*.3),k=o.k||'roof';
    poly([P(-L,-Wd,y0),P(L,-Wd,y0),P(L,0,y0+h),P(-L,0,y0+h)],ctr,{k});
    poly([P(L,Wd,y0),P(-L,Wd,y0),P(-L,0,y0+h),P(L,0,y0+h)],ctr,{k});
    poly([P(-L,-Wd,y0),P(-L,0,y0+h),P(-L,Wd,y0)],ctr,{k});
    poly([P(L,-Wd,y0),P(L,Wd,y0),P(L,0,y0+h)],ctr,{k});
    if(o.chofa){const Q=(a,b,y)=>ax==='x'?[cx+a,y,cz+b]:[cx+b,y,cz+a];
      [-1,1].forEach(s=>line(Q(s*L,0,y0+h),Q(s*(L+.07),0,y0+h+.12),.85,1.1))}
  }
  function prang(cx,cz,y0,y1,r,tiers,n,bulge,o={}){
    const f=t=>r*(bulge?Math.sin(Math.PI*(.5+t*.47))*(1-t*.5)+.08*(1-t):(1-t*.92));
    for(let i=0;i<tiers;i++){const a=i/tiers,b=(i+1)/tiers,r0=f(a),r1=f(b),y=y0+(y1-y0)*a;
      if(!o.nob) cyl(cx,cz,r0*1.07,n,y,y+(y1-y0)/tiers*.2,1,{k:'band',top:false});
      cyl(cx,cz,r0,n,y,y0+(y1-y0)*b,r1/r0,{k:o.k||'solid'});}
  }

  /* ---------- King Power MahaNakhon (314 m) — pixel ribbon carved INTO the tower ---------- */
  {grp(4.6,.9);
   const NX=6,NZ=6,NY=40,cs=.17,ch=.15,ox=-NX*cs/2,oz=-NZ*cs/2;
   const S=new Uint8Array(NX*NY*NZ).fill(1);
   const id=(x,y,z)=>(y*NX+x)*NZ+z;
   const P=[];for(let x=0;x<6;x++)P.push([x,0]);for(let z=1;z<6;z++)P.push([5,z]);for(let x=4;x>=0;x--)P.push([x,5]);for(let z=4;z>=1;z--)P.push([0,z]);
   const inner=([x,z])=>[x===0?1:x===5?4:x,z===0?1:z===5?4:z];
   const Y0=11;

    const p=ptr.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;touched();
    if(ptr.size===1){vYaw=dx*.008;vPitch=dy*.006;yaw+=vYaw;pitch=Math.max(-.05,Math.min(1.4,pitch+vPitch))}
    else if(ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom=clampZ(zoom*d/pinch);pinch=d}
  });
  const up=e=>{ptr.delete(e.pointerId);pinch=0};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();touched();zoom=clampZ(zoom*Math.exp(-e.deltaY*.0015))},{passive:false});
  cv.addEventListener('dblclick',()=>reset());
  function reset(){yaw=home.yaw;pitch=home.pitch;zoom=home.zoom;vYaw=vPitch=0;last=-1e9}
  document.getElementById('reset').addEventListener('click',reset);

  const FLAG=[[165,25,49],[244,245,248],[45,42,74],[45,42,74],[244,245,248],[165,25,49]];
  const t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000,idle=now-last;
    if(ptr.size===0){
      yaw+=vYaw;pitch=Math.max(-.05,Math.min(1.4,pitch+vPitch));vYaw*=.93;vPitch*=.9;
      if(!reduce&&idle>2500) yaw+=.0022*Math.min(1,(idle-2500)/1500);
    }
    cs=Math.cos(yaw);ss=Math.sin(yaw);cp=Math.cos(pitch);sp=Math.sin(pitch);
    K=Math.min(W/15.8,H/9.4)*zoom;
    const bh=reduce?99:(t/2.8)*MAXH*1.05;
    const cy=y=>Math.min(y,bh);
    ctx.clearRect(0,0,W,H);ctx.lineJoin='round';

    /* ground: circular street grid */
    const RG=10;ctx.lineWidth=.8;ctx.strokeStyle='rgba(255,255,255,.05)';ctx.beginPath();
    for(let g=-9;g<=9;g+=1.5){const h=Math.sqrt(RG*RG-g*g);let a=P(g,0,-h),b=P(g,0,h);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);a=P(-h,0,g);b=P(h,0,g);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}
    ctx.stroke();
    ctx.beginPath();for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;const p=P(Math.cos(a)*RG,0,Math.sin(a)*RG);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.strokeStyle='rgba(255,255,255,.16)';ctx.stroke();
    if(!reduce){const rr=((t*.25)%1)*RG;ctx.beginPath();for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;const p=P(Math.cos(a)*rr,0,Math.sin(a)*rr);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.strokeStyle=`rgba(255,255,255,${.22*(1-rr/RG)})`;ctx.stroke()}

    /* river: Chao Phraya */
    const zs=[];for(let z=-9.2;z<=8.6;z+=.4)zs.push(z);
    const L1=zs.map(z=>P(xr(z)-.75,0,z)),R1=zs.map(z=>P(xr(z)+.75,0,z));
    path([...L1,...R1.reverse()]);ctx.fillStyle='rgba(255,255,255,.045)';ctx.fill();
    [L1,R1].forEach(bk=>{ctx.beginPath();bk.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.stroke()});
    ctx.lineWidth=1;
    for(let i=0;i<36;i++){const lane=(i%3-1)*.38,z=-9.2+((i*1.31+(reduce?0:t*.45))%17.6),z2=z+.35;
      const a=P(xr(z)+lane,0,z),b=P(xr(z2)+lane,0,z2);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle='rgba(255,255,255,.22)';ctx.stroke()}

    /* collect + sort */
    const D=[];
    for(const p of PL){
      if(p.ymin>=bh) continue;
      const vs=p.pts.map(q=>V(q[0],cy(q[1]),q[2]));
      const nv=Vn(p.n);
      const c=vs.reduce((a,v)=>[a[0]+v[0]/vs.length,a[1]+v[1]/vs.length,a[2]+v[2]/vs.length],[0,0,0]);
      const front=nv[0]*c[0]+nv[1]*c[1]+nv[2]*(c[2]+FOC)<0;
      if(!front&&p.k!=='glass'&&p.k!=='glassc'&&p.k!=='sail') continue;
      D.push({z:c[2],s:vs.map(S),p,front,lit:Math.max(0,dot(nv,LD))});
    }
    for(const l of LN){if(l.ymin>=bh)continue;const a=S(V(l.a[0],cy(l.a[1]),l.a[2])),b=S(V(l.b[0],cy(l.b[1]),l.b[2]));D.push({z:(a[2]+b[2])/2-.03,ln:[a,b],l})}
    D.sort((a,b)=>b.z-a.z);

    for(const d of D){
      if(d.ln){ctx.beginPath();ctx.moveTo(d.ln[0][0],d.ln[0][1]);ctx.lineTo(d.ln[1][0],d.ln[1][1]);ctx.strokeStyle=`rgba(255,255,255,${d.l.al})`;ctx.lineWidth=d.l.w;ctx.stroke();continue}
      const p=d.p,f=d.front,k=p.k,L=d.lit;
      if(k==='flag'){
        const [b1,b2,t2,t1]=d.s;
        const ph=((p.fi/p.fn)+(reduce?0:t*.05))%1*5,q=ph-Math.floor(ph);
        if(q>.93){path(d.s);ctx.fillStyle='rgba(10,10,12,.95)';ctx.fill();continue}
        const wv=reduce?0:.045*Math.sin(q*Math.PI*3-t*3.2);
        const br=.7+.3*L;
        const cut=[0,1/6+wv,2/6+wv,4/6+wv,5/6+wv,1];
        for(let s=0;s<5;s++){
          const c=FLAG[s===2?2:s>2?s+1:s];
          const y0=cut[s],y1=cut[s+1];
          path([lerp(b1,t1,y0),lerp(b2,t2,y0),lerp(b2,t2,y1),lerp(b1,t1,y1)]);
          ctx.fillStyle=`rgb(${c[0]*br|0},${c[1]*br|0},${c[2]*br|0})`;ctx.fill();
        }
        continue;
      }
      path(d.s);
      if(k==='glassc'){ctx.fillStyle=`rgba(255,255,255,${f?.05+L*.2:.015})`;ctx.fill();continue}
      if(k==='gtop'){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();continue}
      if(k==='sail'){ctx.fillStyle=`rgba(255,255,255,${f?.1+L*.32:.04})`;ctx.fill();continue}
      if(k==='recess'){const g=12+L*55|0;ctx.fillStyle=`rgba(${g},${g},${g+2},.94)`;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=.6;ctx.stroke();continue}
      if(k==='dark'){ctx.fillStyle='rgba(6,6,8,.95)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=.6;ctx.stroke();continue}
      if(k==='glow'){ctx.fillStyle=`rgba(255,255,255,${.35+L*.6})`;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=.6;ctx.stroke();continue}
      if(k==='band'){ctx.fillStyle=`rgba(255,255,255,${.22+L*.4})`;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=.5;ctx.stroke();continue}
      if(k==='solid'||k==='roof'){ctx.fillStyle=`rgba(${k==='roof'?'215,215,210':'255,255,255'},${.1+L*.34})`;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.7;ctx.stroke();continue}
      // glass prism faces
      ctx.fillStyle=p.top?`rgba(255,255,255,${f?.1:.03})`:`rgba(255,255,255,${f?.05+L*.2:.015})`;ctx.fill();
      ctx.strokeStyle=`rgba(255,255,255,${f?.7:.12})`;ctx.lineWidth=f?.9:.5;ctx.stroke();
    }

    /* beacons */
    const blink=reduce?1:(Math.sin(t*3)>.2?1:.25);
    BEACONS.forEach(([x,y,z],i)=>{if(bh<y-.2)return;const p=P(x,y,z);const r=8*Math.min(2,Math.sqrt(zoom));const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);const b=i%2?1-blink*.6:blink;g.addColorStop(0,`rgba(255,255,255,${.9*b})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill()});

    /* labels */
    if(bh>MAXH*.92){
      const a=Math.min(1,(bh-MAXH*.92)/1.2);
      ctx.font=lang==='th'?'500 10.5px "IBM Plex Sans Thai", system-ui, sans-serif':'500 9.5px "JetBrains Mono", ui-monospace, monospace';ctx.textAlign='center';
      LB.forEach(l=>{const [x,y,z]=l.p;const p=P(x,y,z),q=P(x,y+.3,z);
        ctx.strokeStyle=`rgba(255,255,255,${.35*a})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]-3);ctx.stroke();
        const tx=lang==='th'?l.th:l.en.toUpperCase(),tw=ctx.measureText(tx).width+10,qx=Math.max(tw/2+4,Math.min(W-tw/2-4,q[0]));
        ctx.fillStyle=`rgba(0,0,0,${.6*a})`;ctx.fillRect(qx-tw/2,q[1]-18,tw,14);
        ctx.fillStyle=`rgba(255,255,255,${.92*a})`;ctx.fillText(tx,qx,q[1]-7)});
    }

    for(let i=0;i<60;i++){const x=(hash(i,1,2)-.5)*18,z=(hash(i,3,4)-.5)*16,y=(hash(i,5,6)*7+(reduce?0:t*.12))%7;const p=P(x,y,z);ctx.fillStyle=`rgba(255,255,255,${.1+hash(i,7,8)*.3})`;ctx.fillRect(p[0],p[1],1.3,1.3)}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {setLang:l=>{lang=l}};
})();

</script>
